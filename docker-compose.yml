# Local development database only. Never point this at a hosted database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stockmiles
      POSTGRES_PASSWORD: stockmiles
      POSTGRES_DB: stockmiles_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmiles -d stockmiles_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
