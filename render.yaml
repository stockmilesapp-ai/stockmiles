# Render Blueprint: the service settings live in the repo, not only in the dashboard.
services:
  - type: web
    name: stockmiles
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    branch: main
    # Liveness only: never touches the database (see /api/health/live in apps/api/src/app.ts).
    healthCheckPath: /api/health/live
    envVars:
      - key: LOG_LEVEL
        value: info
